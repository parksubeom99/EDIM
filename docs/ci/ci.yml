name: CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env: { POSTGRES_USER: edim, POSTGRES_PASSWORD: edim, POSTGRES_DB: edim }
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U edim -d edim" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - run: pnpm db:generate
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm db:seed:demo
      - run: pnpm typecheck
      - run: pnpm -r --workspace-concurrency=1 test
      # DB 가 직접 막는 규칙들 — 앱을 우회해도 거부되는지(RLS · append-only · 발행/발주 잠금 · 플랫폼 열람 차단)
      - run: pnpm --filter @edim/db rls:test
      - run: pnpm --filter @edim/db revision:test
      - run: pnpm --filter @edim/db backbone:test
      - run: pnpm --filter @edim/db platform:test
      - run: pnpm --filter @edim/db drawing:test
      - run: pnpm --filter @edim/db document:test
